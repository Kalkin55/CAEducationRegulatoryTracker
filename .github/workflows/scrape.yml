name: Check agencies

on:
  schedule:
    # Times are UTC. Every 2 hours from about 6am to 8pm Pacific on weekdays...
    - cron: "7 13-23/2,1,3 * * 1-5"
    # ...and every 6 hours otherwise.
    - cron: "7 */6 * * 0,6"
  workflow_dispatch:
    inputs:
      agency:
        description: "Only this agency id (e.g. sbe). Leave blank for all."
        required: false

# Some agency sites (cde.ca.gov, dgs.ca.gov, ccee-ca.org) refuse requests from
# cloud data centers such as GitHub's. Those agencies can be checked from an
# office computer running a self-hosted GitHub runner: set the repository
# variable USE_OFFICE_RUNNER to "true" once the runner is installed. Until
# then GitHub's servers try every agency, and the blocked ones show as failing.
env:
  OFFICE_AGENCIES: ${{ vars.OFFICE_AGENCIES || 'sbe,accs,cpag,opsc,ccee' }}

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Scrape and alert
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TRACKER_USER_AGENT: ${{ vars.TRACKER_USER_AGENT }}
          AGENCY: ${{ inputs.agency }}
          EXCLUDE: ${{ vars.USE_OFFICE_RUNNER == 'true' && env.OFFICE_AGENCIES || '' }}
        run: python -m tracker run ${AGENCY:+--agency "$AGENCY"} --exclude "$EXCLUDE"

  office:
    if: vars.USE_OFFICE_RUNNER == 'true'
    runs-on: self-hosted
    timeout-minutes: 60
    # Uses the Python installed on the office computer (3.12 or newer, installed
    # for all users and added to PATH). actions/setup-python is unreliable on
    # self-hosted Windows runners.
    steps:
      - uses: actions/checkout@v4
      - name: Create Python environment
        run: ${{ runner.os == 'Windows' && 'py -3' || 'python3' }} -m venv .venv
      - name: Install
        run: ${{ runner.os == 'Windows' && '.venv\Scripts\python.exe' || '.venv/bin/python' }} -m pip install --quiet --disable-pip-version-check .
      - name: Scrape and alert (agencies that block cloud servers)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TRACKER_USER_AGENT: ${{ vars.TRACKER_USER_AGENT }}
          PYTHONIOENCODING: utf-8
        run: ${{ runner.os == 'Windows' && '.venv\Scripts\python.exe' || '.venv/bin/python' }} -m tracker run --agencies "${{ env.OFFICE_AGENCIES }}"
