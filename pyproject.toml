[project]
name = "ca-ed-tracker"
version = "0.1.0"
description = "Tracks California education-related regulatory agency agendas"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pdfplumber>=0.11",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
