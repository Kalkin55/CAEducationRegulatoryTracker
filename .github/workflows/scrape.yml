name: Check agencies

on:
  schedule:
    # Times are UTC. Every 2 hours from about 6am to 8pm Pacific on weekdays...
    - cron: "7 13-23/2,1,3 * * 1-5"
    # ...and every 6 hours otherwise.
    - cron: "7 */6 * * 0,6"
  workflow_dispatch:
    inputs:
      agency:
        description: "Only this agency id (e.g. sbe). Leave blank for all."
        required: false

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Scrape and alert
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TRACKER_USER_AGENT: ${{ vars.TRACKER_USER_AGENT }}
        run: python -m tracker run ${{ inputs.agency && format('--agency {0}', inputs.agency) || '' }}
